<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Цена согласования</title><style>*{box-sizing:border-box}body{margin:0;background:#fff9ed;color:#13243c;font:16px system-ui,sans-serif}.wrap{max-width:820px;margin:auto;padding:14px}h1{font-size:1.25rem;margin:0 0 6px}p{margin:7px 0;font-size:.9rem}.row{display:grid;grid-template-columns:1fr minmax(90px,2fr) 58px;gap:12px;align-items:center;margin:8px 0}input[type=range]{width:100%;accent-color:#b45309}input[type=number]{width:100%;min-width:0;border:1px solid #d9b77e;border-radius:7px;padding:5px}.chart{display:flex;align-items:end;gap:30px;height:130px;border-bottom:2px solid #172a43;padding:0 20px}.column{width:35%;max-width:170px;background:#d78a14;border-radius:8px 8px 0 0;display:flex;align-items:start;justify-content:center;padding-top:5px;color:#fff;font-weight:700;min-height:28px}.column:nth-child(2){background:#254668}.labels{display:flex;gap:30px;padding:4px 20px}.labels span{width:35%;max-width:170px;font-size:.8rem}.note{font-size:.8rem;color:#51483a}@media(max-width:440px){body{font-size:13px}.row{gap:5px;grid-template-columns:1fr 1fr 49px}.wrap{padding:8px}.chart{height:110px}.labels span{font-size:.7rem}}</style></head><body><div class="wrap"><h1>Сколько времени займёт согласование?</h1><p>Измените числа или ползунки. Сравнивается время участия людей, а не качество решения.</p><div id="controls"></div><div class="chart"><div class="column" id="one"></div><div class="column" id="many"></div></div><div class="labels"><span>Один ответственный</span><span>Обсуждение командой</span></div><p id="result"></p><p class="note">Условная арифметическая модель: трудозатраты = участники × минуты встречи; без подготовки и повторных встреч.</p></div><script>const fields=[['participants','Участников',2,12,4],['minutes','Минут встречи',5,120,30],['solo','Минут одному',5,120,20]];const data={};const el=document.querySelector('#controls');for(const [id,label,min,max,val] of fields){data[id]=val;const row=document.createElement('label');row.className='row';row.innerHTML=`<span>${label}</span><input type="range" min="${min}" max="${max}" value="${val}" aria-label="${label}"><input type="number" min="${min}" max="${max}" value="${val}" aria-label="${label}: число">`;const [range,num]=row.querySelectorAll('input');for(const x of [range,num])x.addEventListener('input',()=>{const n=Math.min(max,Math.max(min,Number(x.value)||min));data[id]=n;range.value=n;num.value=n;draw()});el.append(row)}function draw(){const a=data.solo,b=data.participants*data.minutes,scale=Math.max(a,b);const one=document.querySelector('#one'),many=document.querySelector('#many');one.style.height=`${Math.max(22,a/scale*100)}%`;many.style.height=`${Math.max(22,b/scale*100)}%`;one.textContent=a+' мин';many.textContent=b+' мин';document.querySelector('#result').textContent=`Разница: ${Math.abs(b-a)} человеко-минут. Время встречи на часах: ${data.minutes} минут.`}draw()</script></body></html>
