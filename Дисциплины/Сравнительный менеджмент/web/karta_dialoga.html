<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Карта диалога</title><style>
*{box-sizing:border-box}body{font:15px/1.4 system-ui,-apple-system,sans-serif;color:#17243b;margin:0;padding:14px;background:#fff}h1{font-size:1.2rem;margin:0}p{margin:5px 0 10px;color:#475569}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 15px}.axis{background:#fffbeb;border:1px solid #f3dfbb;border-radius:9px;padding:6px 9px}.axis b{display:block;font-size:.85rem}.ends{display:flex;justify-content:space-between;font-size:.72rem;color:#475569}.row{display:grid;grid-template-columns:64px 1fr 44px;align-items:center;gap:6px;font-size:.74rem}.row input[type=range]{width:100%;accent-color:#b45309}.row input[type=number]{width:44px;border:1px solid #cbd5e1;border-radius:5px;padding:3px}button{border:0;border-radius:8px;background:#92400e;color:white;font-weight:700;padding:9px 14px;cursor:pointer}#result{display:inline;margin-left:10px;color:#25334a;font-weight:650}.note{font-size:.78rem;color:#64748b;margin-top:9px}input:focus-visible,button:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}@media(max-width:700px){.grid{grid-template-columns:1fr}#result{display:block;margin:8px 0}}
</style></head><body><h1>Карта диалога</h1><p>Оцените свои предпочтения и предпочтения партнёра после разговора. Шкала 1–5 — повод для обсуждения, а не оценка человека или страны.</p><div id="axes" class="grid"></div><p><button id="show" type="button">Найти темы для разговора</button><span id="result" aria-live="polite"></span></p><p class="note">По мотивам восьми шкал Эрин Мейер. Позиции — ваши оценки, не официальные баллы модели. Даже одинаковые оценки стоит уточнить примерами.</p>
<script id="comparison-core">
function comparePreferences(a, b) {
  return a.map((v, i) => ({i, difference: Math.abs(v - b[i])})).filter(x => x.difference > 0).sort((x, y) => y.difference - x.difference || x.i - y.i).map(x => x.i);
}
</script><script>
const axes=[['Коммуникация','Прямое сообщение','Больше контекста'],['Обратная связь','Прямая критика','Дипломатичная критика'],['Убеждение','Принцип сначала','Пример сначала'],['Лидерство','Равноправие','Иерархия'],['Решения','Консенсус','Решение руководителя'],['Доверие','Совместная работа','Личные отношения'],['Несогласие','Открыто','Осторожно'],['Сроки','Чёткий график','Гибкий график']];
const root=document.getElementById('axes');
axes.forEach((axis,i)=>{const box=document.createElement('section');box.className='axis';const title=document.createElement('b');title.textContent=axis[0];box.append(title);const ends=document.createElement('div');ends.className='ends';ends.innerHTML=`<span>1 · ${axis[1]}</span><span>${axis[2]} · 5</span>`;box.append(ends);['Я','Партнёр'].forEach((who,j)=>{const row=document.createElement('label');row.className='row';const caption=document.createElement('span');caption.textContent=who;const range=document.createElement('input');range.type='range';range.min='1';range.max='5';range.value='3';range.setAttribute('aria-label',`${axis[0]}: ${who}`);const number=document.createElement('input');number.type='number';number.min='1';number.max='5';number.value='3';number.setAttribute('aria-label',`${axis[0]}: ${who}, число`);range.dataset.axis=i;range.dataset.person=j;range.addEventListener('input',()=>{number.value=range.value});number.addEventListener('change',()=>{let v=Math.round(Number(number.value));if(!Number.isFinite(v))v=3;v=Math.max(1,Math.min(5,v));range.value=number.value=String(v)});row.append(caption,range,number);box.append(row)});root.append(box)});
document.getElementById('show').addEventListener('click',()=>{const values=[0,1].map(j=>axes.map((_,i)=>Number(root.querySelector(`input[type=range][data-axis="${i}"][data-person="${j}"]`).value)));const ranked=comparePreferences(...values);document.getElementById('result').textContent=ranked.length?`Обсудите сначала: ${ranked.slice(0,3).map(i=>axes[i][0].toLowerCase()).join(', ')}. Спросите, что именно каждый понимает под своей оценкой.`:'Оценки совпадают. Проверьте на примерах, одинаково ли вы понимаете договорённости.'});
</script></body></html>
