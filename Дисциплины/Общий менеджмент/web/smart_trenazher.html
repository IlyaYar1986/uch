<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр: цель по SMART</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --border:#e2e8f0;
  --acc:#0e7490;
  --acc-dk:#155e75;
  --acc-lt:#ecfeff;
  --green:#16a34a;
  --green-lt:#f0fdf4;
  --red:#dc2626;
  --red-lt:#fef2f2;
  --text:#0f172a;
  --muted:#64748b;
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#fff;color:var(--text);line-height:1.4;padding:12px 16px}
.back{display:inline-block;font-size:.78rem;font-weight:700;color:var(--muted);text-decoration:none;margin-bottom:6px}
.back:hover{color:var(--acc)}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:8px}
h1{font-size:1.05rem;font-weight:800}
.sub{color:var(--muted);font-size:.8rem}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.btn{padding:4px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;font:inherit;font-size:.76rem;font-weight:700;color:var(--muted);cursor:pointer}
.btn:hover,.btn.on{border-color:#a5f3fc;color:var(--acc-dk);background:var(--acc-lt)}
.panel{border:1px solid var(--border);border-radius:12px;padding:10px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 14px;font-size:.78rem;font-weight:700;color:var(--muted)}
.form label{display:flex;flex-direction:column;gap:3px}
.form input,.form select{padding:5px 8px;border:1px solid var(--border);border-radius:7px;font:inherit;font-weight:600;color:var(--text)}
.goal{margin:10px 0 6px;padding:10px 12px;border-radius:10px;background:#f8fafc;border:1px dashed var(--border);font-size:.95rem;font-weight:700}
.letters{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0}
.let{border-radius:10px;padding:6px;text-align:center;border:1px solid var(--border);font-size:.7rem;color:var(--muted)}
.let b{display:block;font-size:1.3rem}
.let.ok{background:var(--green-lt);border-color:#bbf7d0;color:var(--green)}
.let.no{background:var(--red-lt);border-color:#fecaca;color:var(--red)}
.q{font-size:.95rem;font-weight:700;margin-bottom:8px}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.checks label{border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:.8rem;font-weight:700;cursor:pointer;display:flex;gap:5px;align-items:center}
.result{border:1px solid #a5f3fc;border-left:5px solid var(--acc);background:var(--acc-lt);border-radius:12px;padding:8px 12px;font-size:.84rem;margin-top:8px}
.result b{color:var(--acc-dk)}
.nav{display:flex;gap:6px;align-items:center;font-size:.78rem;color:var(--muted);font-weight:700}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc-dk);outline-offset:2px}
</style>
</head>
<body>
<a class="back" href="../index.html" target="_top">← Все уроки</a>
<div class="top">
  <h1>Цель по SMART</h1>
  <span class="sub">Соберите свою цель или найдите, какой буквы не хватает в чужой</span>
</div>
<div class="tabs">
  <button type="button" class="btn on" data-t="build">Конструктор цели</button>
  <button type="button" class="btn" data-t="check">Найди ошибку: 8 формулировок</button>
</div>

<div class="panel" id="build">
  <div class="form">
    <label>Что сделать (конкретное действие)
      <select id="act">
        <option value="">— не выбрано: «работать лучше» —</option>
        <option>Увеличить продажи</option>
        <option>Сократить срок обработки заявок</option>
        <option>Провести вебинары для клиентов</option>
        <option>Снизить текучесть персонала</option>
      </select></label>
    <label>На сколько (показатель)
      <input type="number" id="num" placeholder="например, 30" min="0"></label>
    <label>Единица
      <select id="unit"><option>%</option><option>шт.</option><option>дней</option><option>тыс. ₽</option></select></label>
    <label>Срок
      <input type="date" id="date"></label>
    <label>Хватит ли ресурсов у исполнителя?
      <select id="res"><option value="">— не оценивали —</option><option value="yes">да, оценили: ресурсов и времени хватает</option><option value="no">нет, это сверх возможностей</option></select></label>
    <label>Связь со стратегией компании
      <select id="rel"><option value="">— не думали —</option><option value="yes">да, это сейчас приоритет компании</option><option value="no">нет, «просто хорошо бы»</option></select></label>
  </div>
  <div class="goal" id="goal"></div>
  <div class="letters" id="letters"></div>
  <div class="result" id="b-result" aria-live="polite"></div>
</div>

<div class="panel" id="check" hidden>
  <div class="nav"><button type="button" class="btn" id="prev">←</button><span id="pos"></span><button type="button" class="btn" id="next">→</button></div>
  <p class="q" id="q" style="margin-top:8px"></p>
  <p style="font-size:.8rem;color:var(--muted);margin-bottom:6px">Отметьте буквы, которых <b>не хватает</b> (если цель правильная — ничего не отмечайте):</p>
  <div class="checks" id="checks"></div>
  <button type="button" class="btn" id="verify">Проверить</button>
  <div class="result" id="c-result" aria-live="polite">Выберите и нажмите «Проверить».</div>
</div>

<script>
/* S — конкретная, M — измеримая, A — достижимая, R — значимая (релевантная), T — ограниченная во времени. */
const L = [["S", "конкретная"], ["M", "измеримая"], ["A", "достижимая"], ["R", "значимая"], ["T", "срок"]];
const $ = (id) => document.getElementById(id);

function build() {
  const act = $("act").value, num = $("num").value, unit = $("unit").value, date = $("date").value, res = $("res").value, rel = $("rel").value;
  const ok = { S: !!act, M: !!act && num !== "" && Number(num) > 0, A: res === "yes", R: rel === "yes", T: !!date };
  const d = date ? new Date(date).toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" }) : "";
  const text = `${act || "Работать лучше"}${ok.M ? ` на ${num} ${unit}` : ""}${d ? ` до ${d}` : ""}`;
  $("goal").textContent = `«${text}»`;
  $("letters").innerHTML = L.map(([k, n]) => `<div class="let ${ok[k] ? "ok" : "no"}"><b>${k}</b>${n}</div>`).join("");
  const miss = L.filter(([k]) => !ok[k]);
  let msg;
  if (!miss.length) msg = "<b>Цель по SMART.</b> Постановщик и исполнитель понимают одинаково: что, на сколько, к какому сроку, почему важно и почему выполнимо.";
  else {
    const why = {
      S: "нет конкретного действия — «работать лучше» каждый поймёт по-своему",
      M: "нет числа — не понять, выполнена ли цель",
      A: res === "no" ? "цель сверх ресурсов исполнителя — это «завышенные ожидания», типичная ошибка" : "достижимость не оценена: хватит ли людей, денег, времени?",
      R: rel === "no" ? "цель не связана со стратегией — ресурсы уйдут не туда (реклама поп-апов вместо чат-бота)" : "не проверено, нужна ли цель компании сейчас",
      T: "нет срока — исполнитель решает сам, когда, и цель не проконтролировать",
    };
    msg = `Не хватает: ${miss.map(([k]) => `<b>${k}</b> — ${why[k]}`).join("; ")}.`;
  }
  $("b-result").innerHTML = msg;
}
["act", "num", "unit", "date", "res", "rel"].forEach((id) => $(id).addEventListener("input", build));

const CASES = [
  { t: "Зарабатывать больше.", miss: ["S", "M", "T"], why: "Пример преподавателя: не конкретно (что делать?), нет числа и срока." },
  { t: "Увеличить продажи на 30 % до 30 сентября.", miss: [], why: "Конкретное действие, число и дата. A и R по условию считаем проверенными." },
  { t: "Провести вебинары для клиентов в течение квартала.", miss: ["M"], why: "Сколько вебинаров? Пример неправильной задачи со слайда: «не хватает количества»." },
  { t: "Увеличить выручку на 15 % в следующем году.", miss: [], why: "Срок «в следующем году» — тоже граница во времени, хотя дата точнее." },
  { t: "Сократить срок обработки заявки с 5 до 2 дней.", miss: ["T"], why: "Всё конкретно и измеримо, но к какому сроку? Без даты не проконтролировать." },
  { t: "Отделу из двух человек за неделю вывести продукт на рынки 20 стран.", miss: ["A"], why: "Завышенные ожидания: ресурсов исполнителя на это не хватит." },
  { t: "Бухгалтерии до 1 декабря увеличить подписчиков в соцсетях на 5 000.", miss: ["R"], why: "Цель не вписывается в задачи подразделения и стратегию: значимость (R) нарушена." },
  { t: "Улучшить работу с клиентами в ближайшее время.", miss: ["S", "M", "T"], why: "«Улучшить работу» — не конкретно, без числа; «в ближайшее время» — не срок." },
];
let idx = 0;
function showCase() {
  const c = CASES[idx];
  $("pos").textContent = `${idx + 1} / ${CASES.length}`;
  $("q").textContent = `«${c.t}»`;
  $("checks").innerHTML = L.map(([k, n]) => `<label><input type="checkbox" value="${k}"> ${k} — ${n}</label>`).join("");
  $("c-result").textContent = "Выберите и нажмите «Проверить».";
}
$("verify").addEventListener("click", () => {
  const c = CASES[idx];
  const sel = [...$("checks").querySelectorAll("input:checked")].map((x) => x.value).sort().join("");
  const right = [...c.miss].sort().join("");
  $("c-result").innerHTML = `${sel === right ? "<b>Верно!</b> " : `<b>Не совсем.</b> Не хватает: ${c.miss.length ? c.miss.join(", ") : "ничего — цель правильная"}. `}${c.why}`;
});
$("prev").addEventListener("click", () => { idx = (idx + CASES.length - 1) % CASES.length; showCase(); });
$("next").addEventListener("click", () => { idx = (idx + 1) % CASES.length; showCase(); });
document.querySelectorAll("[data-t]").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll("[data-t]").forEach((x) => x.classList.toggle("on", x === b));
  $("build").hidden = b.dataset.t !== "build";
  $("check").hidden = b.dataset.t !== "check";
}));
build(); showCase();
</script>
</body>
</html>
