<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр: какое это объединение?</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --border:#e2e8f0;
  --acc:#0e7490;
  --acc-dk:#155e75;
  --acc-lt:#ecfeff;
  --red:#dc2626;
  --red-lt:#fef2f2;
  --green:#16a34a;
  --green-lt:#f0fdf4;
  --text:#0f172a;
  --muted:#64748b;
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#fff;color:var(--text);line-height:1.45;padding:12px 16px}
.back{display:inline-block;font-size:.78rem;font-weight:700;color:var(--muted);text-decoration:none;margin-bottom:6px}
.back:hover{color:var(--acc)}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:10px}
h1{font-size:1.05rem;font-weight:800}
.sub{color:var(--muted);font-size:.8rem}
.progress{display:flex;gap:4px;margin-bottom:12px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--border)}
.progress i.ok{background:var(--green)}
.progress i.bad{background:var(--red)}
.progress i.now{background:var(--acc)}
.case{border:1px solid var(--border);border-left:5px solid var(--acc);border-radius:12px;padding:14px 16px;background:var(--acc-lt);font-size:1rem;margin-bottom:12px;min-height:72px}
.case b{color:var(--acc-dk)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
@media (max-width:560px){.opts{grid-template-columns:repeat(2,1fr)}}
.opt{padding:9px 8px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:.86rem;font-weight:700;color:var(--text);cursor:pointer;font-family:inherit}
.opt:hover{border-color:var(--acc);color:var(--acc)}
.opt:disabled{cursor:default;opacity:.55}
.opt.right{background:var(--green-lt);border-color:var(--green);color:var(--green);opacity:1}
.opt.wrong{background:var(--red-lt);border-color:var(--red);color:var(--red);opacity:1}
.fb{border-radius:10px;padding:10px 14px;font-size:.88rem;margin-bottom:10px}
.fb.ok{background:var(--green-lt);color:#14532d}
.fb.bad{background:var(--red-lt);color:#7f1d1d}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:9px;border:none;background:var(--acc);color:#fff;font-weight:700;font-size:.85rem;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--acc-dk)}
.score{font-weight:800;color:var(--acc-dk);font-size:.88rem}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc-dk);outline-offset:2px}
</style>
</head>
<body>
<a class="back" href="../index.html" target="_top">← Все уроки</a>
<div class="top">
  <h1>Какое это объединение?</h1>
  <span class="sub">9 ситуаций · определяйте по сути соглашения, а не по названию</span>
</div>
<div class="progress" id="progress" aria-hidden="true"></div>
<div class="case" id="case" aria-live="polite"></div>
<div class="opts" id="opts"></div>
<div class="fb" id="fb" hidden></div>
<div class="row">
  <button type="button" class="btn" id="next" hidden>Следующая ситуация →</button>
  <span class="score" id="score"></span>
</div>

<script>
/* Формы объединений и ситуации; why — разбор после ответа */
const FORMS = ["Ассоциация", "Картель", "Консорциум", "Концерн", "ФПГ", "Синдикат", "Пул", "Трест", "Холдинг"];
const CASES = [
  {text: "Пять молокозаводов области договорились продавать молоко через <b>общую торговую компанию</b> по единому прайсу. Производство у каждого своё.", ans: "Синдикат",
    why: "Синдикат — производители однородной продукции объединяются для совместной продажи. Производство остаётся самостоятельным."},
  {text: "Три сети АЗС <b>тайно договорились</b> не опускать цену ниже 60 ₽ за литр и не открываться в «чужих» районах.", ans: "Картель",
    why: "Картель — соглашение о ценах, объёмах и разделе рынков. Это запрещено антимонопольным законом, как бы участники ни назывались."},
  {text: "Вуз, НИИ и два завода подписали соглашение <b>на три года</b>, чтобы вместе выполнить грант на разработку аккумулятора.", ans: "Консорциум",
    why: "Консорциум — временное соглашение под конкретный капиталоёмкий проект, участники из разных отраслей."},
  {text: "Горно-обогатительный комбинат, металлургический завод, завод метизов и торговый дом объединены в группу по цепочке <b>«руда → металл → изделия → продажа»</b>.", ans: "Концерн",
    why: "Концерн — объединение компаний одной технологической цепочки, от снабжения до реализации."},
  {text: "К такой же цепочке «руда → продажа» добавили <b>собственный банк и страховую компанию</b>.", ans: "ФПГ",
    why: "Финансово-промышленная группа — концерн, в который входит банк или страховая компания."},
  {text: "Компании отрасли объединились, чтобы <b>обмениваться опытом</b>, проводить конференции и вместе представлять интересы отрасли перед властью.", ans: "Ассоциация",
    why: "Ассоциация (союз) — взаимное сотрудничество и обмен опытом. По ГК РФ это форма некоммерческой организации."},
  {text: "Несколько перевозчиков складывают выручку маршрута в <b>общий котёл</b> и делят её по заранее согласованным долям.", ans: "Пул",
    why: "Пул — соглашение о распределении общей прибыли (доходов) между участниками."},
  {text: "Головная компания назначает директоров заводов, утверждает их бюджеты и все сделки. <b>Своей финансовой и управленческой самостоятельности</b> у заводов нет.", ans: "Трест",
    why: "Трест — жёсткая форма: участники теряют управленческую и финансовую самостоятельность, решает головная организация."},
  {text: "Управляющая компания <b>владеет контрольными пакетами</b> акций пяти разных бизнесов: сети кафе, застройщика, агрохолдинга, клиники и IT-компании.", ans: "Холдинг",
    why: "Холдинг — головная компания владеет контрольными пакетами других. Технологической цепочки здесь нет, поэтому это не концерн."}
];

/* Перемешиваем порядок ситуаций при каждом запуске */
const order = CASES.map((_, i) => i).sort(() => Math.random() - 0.5);
let step = 0;
let correct = 0;
const results = [];

const caseEl = document.getElementById("case");
const optsEl = document.getElementById("opts");
const fbEl = document.getElementById("fb");
const nextEl = document.getElementById("next");
const scoreEl = document.getElementById("score");
const progressEl = document.getElementById("progress");

function renderProgress() {
  progressEl.innerHTML = CASES.map((_, i) => {
    const cls = results[i] === true ? "ok" : results[i] === false ? "bad" : i === step ? "now" : "";
    return `<i class="${cls}"></i>`;
  }).join("");
}

function renderCase() {
  const item = CASES[order[step]];
  caseEl.innerHTML = `<span class="sub">Ситуация ${step + 1} из ${CASES.length}</span><br>${item.text}`;
  optsEl.innerHTML = "";
  FORMS.forEach((form) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "opt";
    button.textContent = form;
    button.addEventListener("click", () => answer(form));
    optsEl.appendChild(button);
  });
  fbEl.hidden = true;
  nextEl.hidden = true;
  renderProgress();
}

function answer(form) {
  const item = CASES[order[step]];
  const isRight = form === item.ans;
  results[step] = isRight;
  if (isRight) correct += 1;
  optsEl.querySelectorAll(".opt").forEach((button) => {
    button.disabled = true;
    if (button.textContent === item.ans) button.classList.add("right");
    else if (button.textContent === form) button.classList.add("wrong");
  });
  fbEl.className = `fb ${isRight ? "ok" : "bad"}`;
  fbEl.textContent = (isRight ? "Верно! " : `Это ${item.ans.toLowerCase()}. `) + item.why;
  fbEl.hidden = false;
  scoreEl.textContent = `Верно: ${correct} из ${step + 1}`;
  nextEl.hidden = false;
  nextEl.textContent = step + 1 < CASES.length ? "Следующая ситуация →" : "Пройти заново ↻";
  renderProgress();
}

nextEl.addEventListener("click", () => {
  if (step + 1 < CASES.length) {
    step += 1;
    renderCase();
  } else {
    window.location.reload();
  }
});

renderCase();
</script>
</body>
</html>
