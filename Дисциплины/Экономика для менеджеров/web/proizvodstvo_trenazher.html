<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр: швейный цех — общий, средний и предельный продукт</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --border:#e2e8f0;
  --indigo:#6366f1;
  --indigo-dk:#4338ca;
  --indigo-lt:#eef2ff;
  --green:#16a34a;
  --amber:#d97706;
  --red:#dc2626;
  --text:#0f172a;
  --muted:#64748b;
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#fff;color:var(--text);line-height:1.4;padding:12px 16px}
.back{display:inline-block;font-size:.78rem;font-weight:700;color:var(--muted);text-decoration:none;margin-bottom:6px}
.back:hover{color:var(--indigo)}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:8px}
h1{font-size:1.05rem;font-weight:800}
.sub{color:var(--muted);font-size:.8rem}
.layout{display:grid;grid-template-columns:minmax(290px,1.3fr) minmax(240px,1fr);gap:14px;align-items:start}
@media (max-width:700px){.layout{grid-template-columns:1fr}}
.chart-box{border:1px solid var(--border);border-radius:12px;padding:4px;background:#fcfcff}
svg{width:100%;height:auto;display:block;max-height:52vh}
.ctrl{margin-bottom:10px}
.ctrl label{display:flex;justify-content:space-between;font-size:.8rem;font-weight:700;color:var(--muted)}
.ctrl input{width:100%;accent-color:var(--indigo)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.kpi{border:1px solid var(--border);border-radius:10px;padding:6px;background:#f8fafc;text-align:center}
.kpi .k-l{font-size:.62rem;font-weight:700;color:var(--muted);text-transform:uppercase}
.kpi .k-v{font-size:1.1rem;font-weight:900}
.result{border:1px solid #c7d2fe;border-left:5px solid var(--indigo);background:var(--indigo-lt);border-radius:12px;padding:9px 13px;font-size:.85rem}
.result b{color:var(--indigo-dk)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.7rem;color:var(--muted);padding:0 6px 4px}
.legend i{display:inline-block;width:16px;border-top:3px solid;vertical-align:middle;margin-right:4px}
a:focus-visible,input:focus-visible{outline:2px solid var(--indigo-dk);outline-offset:2px}
</style>
</head>
<body>
<a class="back" href="../index.html" target="_top">← Все уроки</a>
<div class="top">
  <h1>Швейный цех: сколько даёт ещё один работник</h1>
  <span class="sub">Краткосрочный период: машин столько, сколько есть, меняется только число швей</span>
</div>
<div class="layout">
  <div class="chart-box">
    <svg viewBox="0 0 380 300" role="img" aria-label="Графики общего, среднего и предельного продукта">
      <g id="zones"></g>
      <line x1="40" y1="140" x2="370" y2="140" stroke="#94a3b8"/>
      <line x1="40" y1="140" x2="40" y2="10" stroke="#94a3b8"/>
      <text x="44" y="18" font-size="10" fill="#64748b">TP, пар джинсов в день</text>
      <polyline id="tp" fill="none" stroke="#6366f1" stroke-width="3"/>
      <line x1="40" y1="250" x2="370" y2="250" stroke="#94a3b8"/>
      <line x1="40" y1="290" x2="40" y2="160" stroke="#94a3b8"/>
      <text x="44" y="168" font-size="10" fill="#64748b">AP, MP</text>
      <text x="365" y="168" font-size="10" fill="#64748b" text-anchor="end">L — число швей</text>
      <g id="ticks"></g>
      <polyline id="ap" fill="none" stroke="#d97706" stroke-width="2.5"/>
      <polyline id="mp" fill="none" stroke="#16a34a" stroke-width="2.5"/>
      <line id="cur1" stroke="#0f172a" stroke-dasharray="3 3"/>
      <line id="cur2" stroke="#0f172a" stroke-dasharray="3 3"/>
      <circle id="dot" r="5" fill="#6366f1"/>
    </svg>
    <div class="legend"><span><i style="border-color:#6366f1"></i>TP — общий</span><span><i style="border-color:#d97706"></i>AP — средний</span><span><i style="border-color:#16a34a"></i>MP — предельный</span></div>
  </div>
  <div>
    <div class="ctrl">
      <label for="l"><span>Число швей</span><span id="l-v"></span></label>
      <input type="range" id="l" min="1" max="14" step="1" value="3">
    </div>
    <div class="ctrl">
      <label for="k"><span>Швейных машин</span><span id="k-v"></span></label>
      <input type="range" id="k" min="4" max="10" step="1" value="6">
    </div>
    <div class="kpis">
      <div class="kpi"><div class="k-l">TP</div><div class="k-v" id="k-tp"></div></div>
      <div class="kpi"><div class="k-l">AP</div><div class="k-v" id="k-ap"></div></div>
      <div class="kpi"><div class="k-l">MP</div><div class="k-v" id="k-mp"></div></div>
    </div>
    <div class="result" id="result" aria-live="polite"></div>
  </div>
</div>

<script>
/* Условная производственная функция TP = a·L² − L³ (в масштабе).
   MP максимален при L = a/3, TP — при L = 2a/3; a подобрано так, что пик TP — при 1,6 швеи на машину. */
const lEl = document.getElementById("l");
const kEl = document.getElementById("k");
const MAX_L = 14;

function tp(L, K) {
  const peakL = 1.6 * K;
  const a = 1.5 * peakL;
  const scale = (25 * K) / (peakL * peakL * (a - peakL));
  return Math.max(0, scale * (a * L * L - L * L * L));
}

function render() {
  const L = Number(lEl.value);
  const K = Number(kEl.value);
  const series = [];
  for (let i = 0; i <= MAX_L; i++) series.push(tp(i, K));
  const ap = series.map((v, i) => (i ? v / i : 0));
  const mp = series.map((v, i) => (i ? v - series[i - 1] : 0));
  const maxTP = Math.max(...series, 1);
  const maxAM = Math.max(...mp, ...ap, 1);
  const minAM = Math.min(...mp, 0);
  /* Нижний график: ноль на y = 250, масштаб по положительной части; уход MP ниже края обрезается */
  const k = 80 / maxAM;
  const x = (i) => 40 + (i / MAX_L) * 325;
  const yT = (v) => 140 - (v / maxTP) * 115;
  const yA = (v) => 250 - v * k;
  let ticks = "";
  for (let i = 0; i <= MAX_L; i += 2) ticks += `<text x="${x(i)}" y="152" font-size="9" fill="#94a3b8" text-anchor="middle">${i}</text>`;
  document.getElementById("ticks").innerHTML = ticks;
  document.getElementById("tp").setAttribute("points", series.map((v, i) => `${x(i)},${yT(v)}`).join(" "));
  document.getElementById("ap").setAttribute("points", ap.slice(1).map((v, i) => `${x(i + 1)},${yA(v)}`).join(" "));
  const mpPoints = [];
  for (let i = 1; i <= MAX_L; i++) {
    const y = yA(mp[i]);
    if (y <= 290) { mpPoints.push(`${x(i)},${y}`); continue; }
    const prevY = yA(mp[i - 1]);
    const t = (290 - prevY) / (y - prevY);
    mpPoints.push(`${x(i - 1) + t * (x(i) - x(i - 1))},290`);
    break;
  }
  document.getElementById("mp").setAttribute("points", mpPoints.join(" "));

  /* Зоны: А — MP растёт, Б — MP падает, но > 0, В — MP < 0 */
  let peak = 1;
  for (let i = 1; i <= MAX_L; i++) if (mp[i] > mp[peak]) peak = i;
  let neg = MAX_L + 1;
  for (let i = 1; i <= MAX_L; i++) if (mp[i] < 0) { neg = i; break; }
  const zone = (from, to, fill, label) => to > from
    ? `<rect x="${x(from - 0.5)}" y="10" width="${x(to - 0.5) - x(from - 0.5)}" height="130" fill="${fill}"/><text x="${(x(from - 0.5) + x(to - 0.5)) / 2}" y="30" font-size="13" font-weight="800" fill="#475569" text-anchor="middle">${label}</text>`
    : "";
  document.getElementById("zones").innerHTML =
    zone(0.5, peak + 1, "rgba(22,163,74,.08)", "А") +
    zone(peak + 1, Math.min(neg, MAX_L + 1), "rgba(217,119,6,.08)", "Б") +
    zone(neg, MAX_L + 1, "rgba(220,38,38,.08)", "В");

  ["cur1", "cur2"].forEach((id) => {
    const line = document.getElementById(id);
    line.setAttribute("x1", x(L)); line.setAttribute("x2", x(L));
  });
  document.getElementById("cur1").setAttribute("y1", 10); document.getElementById("cur1").setAttribute("y2", 140);
  document.getElementById("cur2").setAttribute("y1", 160); document.getElementById("cur2").setAttribute("y2", 290);
  const dot = document.getElementById("dot"); dot.setAttribute("cx", x(L)); dot.setAttribute("cy", yT(series[L]));

  document.getElementById("l-v").textContent = L;
  document.getElementById("k-v").textContent = K;
  document.getElementById("k-tp").textContent = Math.round(series[L]);
  document.getElementById("k-ap").textContent = String(Math.round(ap[L] * 10) / 10).replace(".", ",");
  document.getElementById("k-mp").textContent = String(Math.round(mp[L] * 10) / 10).replace(".", ",");

  let text;
  if (L <= peak) text = `<b>Участок А.</b> Швеи делят операции между собой — разделение труда и специализация. Каждая новая даёт больший прирост, чем предыдущая (MP растёт).`;
  else if (L < neg) text = `<b>Участок Б.</b> Машины заполняются: новая швея всё ещё увеличивает выпуск, но меньше, чем предыдущая. Это закон убывающей отдачи.`;
  else text = `<b>Участок В.</b> MP &lt; 0: лишний человек мешает у занятых машин, выпуск падает. В коммерческой фирме так работать нельзя — либо меньше людей, либо больше машин (долгосрочный период).`;
  if (Math.abs(L - ap.indexOf(Math.max(...ap.slice(1)))) === 0) text += " Сейчас средний продукт максимален: здесь MP пересекает AP.";
  document.getElementById("result").innerHTML = text;
}

lEl.addEventListener("input", render);
kEl.addEventListener("input", render);
render();
</script>
</body>
</html>
