<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр: типичная фирма и рынок совершенной конкуренции</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --border:#e2e8f0;
  --indigo:#6366f1;
  --indigo-dk:#4338ca;
  --indigo-lt:#eef2ff;
  --green:#16a34a;
  --red:#dc2626;
  --amber:#d97706;
  --text:#0f172a;
  --muted:#64748b;
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#fff;color:var(--text);line-height:1.4;padding:12px 16px}
.back{display:inline-block;font-size:.78rem;font-weight:700;color:var(--muted);text-decoration:none;margin-bottom:6px}
.back:hover{color:var(--indigo)}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:6px}
h1{font-size:1.05rem;font-weight:800}
.sub{color:var(--muted);font-size:.8rem}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.btn{padding:4px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;font:inherit;font-size:.74rem;font-weight:700;color:var(--muted);cursor:pointer}
.btn:hover,.btn.on{border-color:#c7d2fe;color:var(--indigo-dk);background:var(--indigo-lt)}
.btn.main{border-color:var(--indigo);color:#fff;background:var(--indigo)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chart-box{border:1px solid var(--border);border-radius:12px;padding:4px;background:#fcfcff}
.chart-box h2{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;padding:2px 6px}
svg{width:100%;height:auto;display:block;max-height:36vh}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 16px;margin:8px 0;font-size:.78rem;color:var(--muted)}
.controls label{display:flex;gap:6px;align-items:center;font-weight:700;justify-content:space-between}
.controls input[type=range]{accent-color:var(--indigo);flex:1;min-width:80px}
.controls span{min-width:34px;text-align:right;color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0}
.kpi{border:1px solid var(--border);border-radius:10px;padding:5px;background:#f8fafc;text-align:center}
.kpi .k-l{font-size:.62rem;font-weight:700;color:var(--muted);text-transform:uppercase}
.kpi .k-v{font-size:1.05rem;font-weight:900}
.result{border:1px solid #c7d2fe;border-left:5px solid var(--indigo);background:var(--indigo-lt);border-radius:12px;padding:8px 12px;font-size:.84rem}
.result b{color:var(--indigo-dk)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--indigo-dk);outline-offset:2px}
@media (max-width:640px){.charts{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<a class="back" href="../index.html" target="_top">← Все уроки</a>
<div class="top">
  <h1>Букашка на спине слона: фирма и рынок</h1>
  <span class="sub">Цену задаёт рынок (справа), фирма выбирает только объём (слева)</span>
</div>
<div class="btns">
  <button type="button" class="btn" data-s="eq">Равновесие</button>
  <button type="button" class="btn" data-s="masks">Маски: спрос подскочил</button>
  <button type="button" class="btn" data-s="crisis">Спрос упал</button>
  <button type="button" class="btn main" id="long">▶ Долгий период: фирмы входят и выходят</button>
</div>
<div class="charts">
  <div class="chart-box"><h2>А. Типичная фирма</h2><svg id="firm" viewBox="0 0 300 200" role="img" aria-label="График типичной фирмы: цена, MC, ATC и оптимальный объём"></svg></div>
  <div class="chart-box"><h2>Б. Рынок (отрасль)</h2><svg id="market" viewBox="0 0 300 200" role="img" aria-label="График рынка: спрос и предложение"></svg></div>
</div>
<div class="controls">
  <label for="a">Спрос рынка (сдвиг D) <input type="range" id="a" min="1600" max="5000" step="100" value="3000"><span id="a-v"></span></label>
  <label for="n">Число фирм N <input type="range" id="n" min="20" max="250" step="1" value="90"><span id="n-v"></span></label>
  <label for="c">Издержки: MC = c + 2q, c = <input type="range" id="c" min="0" max="40" step="2" value="20"><span id="c-v"></span></label>
  <label for="fc">Постоянные издержки FC <input type="range" id="fc" min="100" max="900" step="50" value="400"><span id="fc-v"></span></label>
</div>
<div class="kpis">
  <div class="kpi"><div class="k-l">Цена P = MR</div><div class="k-v" id="k-p"></div></div>
  <div class="kpi"><div class="k-l">Объём фирмы q*</div><div class="k-v" id="k-q"></div></div>
  <div class="kpi"><div class="k-l">Рынок Q*</div><div class="k-v" id="k-Q"></div></div>
  <div class="kpi"><div class="k-l">N = Q* / q*</div><div class="k-v" id="k-n"></div></div>
  <div class="kpi"><div class="k-l">Прибыль фирмы</div><div class="k-v" id="k-pi"></div></div>
</div>
<div class="result" id="result" aria-live="polite"></div>

<script>
/* Модель. Рыночный спрос Q = a − 20P. Фирмы одинаковые: MC = c + 2q, VC = cq + q², ATC = FC/q + c + q.
   Краткосрочно число фирм N задано: предложение рынка Q = N·(P − c)/2 (при P ≥ c = min AVC).
   Равновесие: a − 20P = N(P − c)/2 → P = (a + N·c/2) / (20 + N/2).
   Долгосрочно фирмы входят и выходят, пока P не станет равной min ATC = c + 2√FC при q = √FC. */
const B = 20;
const $ = (id) => document.getElementById(id);
const els = ["a", "n", "c", "fc"].reduce((o, k) => (o[k] = $(k), o), {});
const v = (k) => Number(els[k].value);
const SCEN = { eq: { a: 3000, n: 90 }, masks: { a: 4200, n: 90 }, crisis: { a: 2200, n: 90 } };
let timer = null;

function solve(a, n, c) {
  const p = Math.max(c, (a + n * c / 2) / (B + n / 2));
  const q = (p - c) / 2;
  return { p, q, Q: a - B * p };
}
const fmt = (x, d = 0) => x.toLocaleString("ru-RU", { maximumFractionDigits: d });

function render() {
  const a = v("a"), n = v("n"), c = v("c"), fc = v("fc");
  ["a", "n", "c", "fc"].forEach((k) => ($(`${k}-v`).textContent = v(k)));
  const { p, q, Q } = solve(a, n, c);
  const atc = q > 0 ? fc / q + c + q : Infinity;
  const profit = p * q - fc - c * q - q * q;
  const minAtc = c + 2 * Math.sqrt(fc);

  // --- Фирма: q 0..60, P 0..160
  const fx = (x) => 34 + x * (250 / 60), fy = (y) => 178 - y * (165 / 160);
  let s = `<line x1="34" y1="178" x2="292" y2="178" stroke="#94a3b8"/><line x1="34" y1="178" x2="34" y2="8" stroke="#94a3b8"/>`;
  s += `<text x="288" y="192" font-size="10" fill="#64748b" text-anchor="end">q</text><text x="24" y="14" font-size="10" fill="#64748b">P</text>`;
  if (profit !== 0 && q > 0 && isFinite(atc)) {
    const top = Math.max(p, atc), bot = Math.min(p, atc);
    s += `<rect x="34" y="${fy(top)}" width="${fx(q) - 34}" height="${fy(bot) - fy(top)}" fill="${profit > 0 ? "#16a34a" : "#dc2626"}" opacity=".18"/>`;
  }
  let atcPath = "";
  for (let x = 4; x <= 60; x += 1) {
    const y = fc / x + c + x;
    if (y <= 160) atcPath += `${atcPath ? "L" : "M"}${fx(x).toFixed(1)},${fy(y).toFixed(1)}`;
  }
  s += `<path d="${atcPath}" fill="none" stroke="#d97706" stroke-width="2"/>`;
  s += `<text x="${fx(54)}" y="${fy(fc / 54 + c + 54) - 4}" font-size="10" fill="#d97706" font-weight="700">ATC</text>`;
  const mcEnd = Math.min(60, (160 - c) / 2);
  s += `<line x1="${fx(0)}" y1="${fy(c)}" x2="${fx(mcEnd)}" y2="${fy(c + 2 * mcEnd)}" stroke="#4338ca" stroke-width="2.2"/>`;
  s += `<text x="${fx(mcEnd) - 4}" y="${fy(c + 2 * mcEnd) + 12}" font-size="10" fill="#4338ca" font-weight="700" text-anchor="end">MC</text>`;
  s += `<line x1="34" y1="${fy(p)}" x2="292" y2="${fy(p)}" stroke="#0f172a" stroke-width="2"/>`;
  s += `<text x="290" y="${fy(p) - 4}" font-size="10" fill="#0f172a" font-weight="700" text-anchor="end">P = MR = ${fmt(p, 1)}</text>`;
  s += `<line x1="${fx(q)}" y1="${fy(p)}" x2="${fx(q)}" y2="178" stroke="#0f172a" stroke-dasharray="3 3"/>`;
  s += `<circle cx="${fx(q)}" cy="${fy(p)}" r="4" fill="#4338ca"/><text x="${fx(q)}" y="192" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">q* = ${fmt(q, 1)}</text>`;
  $("firm").innerHTML = s;

  // --- Рынок: Q 0..5000, P 0..160
  const mx = (x) => 34 + x * (250 / 5000), my = fy;
  let m = `<line x1="34" y1="178" x2="292" y2="178" stroke="#94a3b8"/><line x1="34" y1="178" x2="34" y2="8" stroke="#94a3b8"/>`;
  m += `<text x="288" y="192" font-size="10" fill="#64748b" text-anchor="end">Q</text><text x="24" y="14" font-size="10" fill="#64748b">P</text>`;
  const pD0 = Math.min(160, a / B);
  m += `<line x1="${mx(a - B * pD0)}" y1="${my(pD0)}" x2="${mx(Math.min(5000, a))}" y2="${my(Math.max(0, (a - 5000) / B))}" stroke="#16a34a" stroke-width="2.2"/>`;
  m += `<text x="${mx(a - B * pD0) + 6}" y="${my(pD0) + 12}" font-size="10" fill="#16a34a" font-weight="700">D</text>`;
  const pS1 = Math.min(160, c + 2 * 5000 / n);
  m += `<line x1="${mx(0)}" y1="${my(c)}" x2="${mx(n * (pS1 - c) / 2)}" y2="${my(pS1)}" stroke="#4338ca" stroke-width="2.2"/>`;
  m += `<text x="${mx(n * (pS1 - c) / 2) - 4}" y="${my(pS1) + 12}" font-size="10" fill="#4338ca" font-weight="700" text-anchor="end">S (N = ${n})</text>`;
  m += `<line x1="34" y1="${my(p)}" x2="${mx(Q)}" y2="${my(p)}" stroke="#0f172a" stroke-dasharray="3 3"/>`;
  m += `<line x1="${mx(Q)}" y1="${my(p)}" x2="${mx(Q)}" y2="178" stroke="#0f172a" stroke-dasharray="3 3"/>`;
  m += `<circle cx="${mx(Q)}" cy="${my(p)}" r="4" fill="#0f172a"/><text x="${mx(Q) + 6}" y="${my(p) - 6}" font-size="10" font-weight="700">E</text>`;
  m += `<text x="${mx(Q)}" y="192" font-size="10" text-anchor="middle" font-weight="700">Q* = ${fmt(Q)}</text>`;
  m += `<text x="38" y="${my(p) - 4}" font-size="10" font-weight="700">P* = ${fmt(p, 1)}</text>`;
  $("market").innerHTML = m;

  $("k-p").textContent = fmt(p, 1);
  $("k-q").textContent = fmt(q, 1);
  $("k-Q").textContent = fmt(Q);
  $("k-n").textContent = q > 0 ? fmt(Q / q) : "—";
  const pe = $("k-pi");
  pe.textContent = (profit > 0 ? "+" : "") + fmt(profit);
  pe.style.color = profit > 0.5 ? "#16a34a" : profit < -0.5 ? "#dc2626" : "#0f172a";

  let msg = `Рынок установил цену <b>${fmt(p, 1)}</b>. Для фирмы это горизонталь: каждая следующая единица приносит ту же цену, поэтому <b>P = MR</b>. Фирма выпускает, пока <b>P = MC</b>: q* = ${fmt(q, 1)}. Проверка: N = Q* / q* = ${fmt(Q)} / ${fmt(q, 1)} = ${q > 0 ? fmt(Q / q) : "—"}. `;
  if (profit > 0.5) msg += `Цена выше ATC — <b>экономическая прибыль +${fmt(profit)}</b> (зелёный прямоугольник). Барьеров нет: это сигнал новым фирмам. Нажмите «Долгий период» — фирмы войдут, предложение вырастет, цена опустится.`;
  else if (profit < -0.5) msg += `Цена ниже ATC — <b>убыток ${fmt(profit)}</b> (красный прямоугольник). ${p > c ? "Цена выше min AVC, поэтому в коротком периоде фирма работает, покрывая часть FC." : "Цена не покрывает даже переменные — фирма закрывается."} В долгом периоде часть фирм уйдёт, предложение сократится, цена поднимется.`;
  else msg += `<b>P = min ATC = ${fmt(minAtc, 1)}</b>: экономическая прибыль ноль, фирмы получают нормальную прибыль. Входить и выходить незачем — это долгосрочное равновесие.`;
  $("result").innerHTML = msg;
  document.querySelectorAll("[data-s]").forEach((b) => {
    const sc = SCEN[b.dataset.s];
    b.classList.toggle("on", sc.a === a && sc.n === n);
  });
}

function longRun() {
  clearInterval(timer);
  const a = v("a"), c = v("c"), fc = v("fc");
  const pStar = c + 2 * Math.sqrt(fc), qStar = Math.sqrt(fc);
  const target = Math.max(20, Math.min(250, Math.round((a - B * pStar) / qStar)));
  timer = setInterval(() => {
    const n = v("n");
    if (n === target) { clearInterval(timer); return; }
    els.n.value = n + Math.sign(target - n) * Math.max(1, Math.round(Math.abs(target - n) / 8));
    render();
  }, 90);
}

Object.values(els).forEach((el) => el.addEventListener("input", () => { clearInterval(timer); render(); }));
document.querySelectorAll("[data-s]").forEach((b) => b.addEventListener("click", () => {
  clearInterval(timer);
  const sc = SCEN[b.dataset.s];
  els.a.value = sc.a; els.n.value = sc.n; els.c.value = 20; els.fc.value = 400;
  render();
}));
$("long").addEventListener("click", longRun);
render();
</script>
</body>
</html>
