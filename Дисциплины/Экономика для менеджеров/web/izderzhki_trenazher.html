<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр: цех, издержки и цена</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --border:#e2e8f0;
  --indigo:#6366f1;
  --indigo-dk:#4338ca;
  --indigo-lt:#eef2ff;
  --green:#16a34a;
  --red:#dc2626;
  --amber:#d97706;
  --text:#0f172a;
  --muted:#64748b;
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#fff;color:var(--text);line-height:1.4;padding:12px 16px}
.back{display:inline-block;font-size:.78rem;font-weight:700;color:var(--muted);text-decoration:none;margin-bottom:6px}
.back:hover{color:var(--indigo)}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:6px}
h1{font-size:1.05rem;font-weight:800}
.sub{color:var(--muted);font-size:.8rem}
.charts{display:grid;grid-template-columns:2fr 3fr;gap:8px}
.chart-box{border:1px solid var(--border);border-radius:12px;padding:4px;background:#fcfcff}
svg{width:100%;height:auto;display:block;max-height:38vh}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:4px 16px;margin:8px 0;font-size:.78rem;color:var(--muted)}
.controls label{display:flex;gap:6px;align-items:center;font-weight:700;justify-content:space-between}
.controls input[type=range]{accent-color:var(--indigo);flex:1;min-width:80px}
.controls label>i{font-style:normal;min-width:130px}
.controls span{min-width:58px;text-align:right;color:var(--text)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.btn{padding:4px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;font:inherit;font-size:.74rem;font-weight:700;color:var(--muted);cursor:pointer}
.btn:hover{border-color:#c7d2fe;color:var(--indigo)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
.kpi{border:1px solid var(--border);border-radius:10px;padding:5px;background:#f8fafc;text-align:center}
.kpi .k-l{font-size:.62rem;font-weight:700;color:var(--muted);text-transform:uppercase}
.kpi .k-v{font-size:1rem;font-weight:900}
.result{border:1px solid #c7d2fe;border-left:5px solid var(--indigo);background:var(--indigo-lt);border-radius:12px;padding:8px 12px;font-size:.84rem}
.result b{color:var(--indigo-dk)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--indigo-dk);outline-offset:2px}
@media (max-width:640px){.charts{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<a class="back" href="../index.html" target="_top">← Все уроки</a>
<div class="top">
  <h1>Цех, издержки и цена</h1>
  <span class="sub">Слева — производительность, справа — её зеркало в издержках. Двигайте число работников и цену рынка</span>
</div>
<div class="charts">
  <div class="chart-box"><svg id="prod" viewBox="0 0 260 200" role="img" aria-label="Средний и предельный продукт труда"></svg></div>
  <div class="chart-box"><svg id="cost" viewBox="0 0 400 200" role="img" aria-label="Средние и предельные издержки и цена"></svg></div>
</div>
<div class="controls">
  <label for="l"><i>Работников L</i> <input type="range" id="l" min="0.5" max="9.5" step="0.1" value="5"><span id="l-v"></span></label>
  <label for="p"><i>Цена рынка P</i> <input type="range" id="p" min="0" max="8" step="0.1" value="5"><span id="p-v"></span></label>
  <label for="w"><i>Ставка зарплаты w</i> <input type="range" id="w" min="10" max="60" step="1" value="30"><span id="w-v"></span></label>
  <label for="fc"><i>Постоянные FC</i> <input type="range" id="fc" min="0" max="400" step="10" value="150"><span id="fc-v"></span></label>
  <label for="t"><i>Технология (×)</i> <input type="range" id="t" min="0.6" max="1.6" step="0.05" value="1"><span id="t-v"></span></label>
</div>
<div class="btns">
  <button type="button" class="btn" id="opt">Поставить оптимум (P = MC)</button>
  <button type="button" class="btn" data-p="2">Цена ниже min AVC</button>
  <button type="button" class="btn" data-p="3.6">Цена между AVC и ATC</button>
  <button type="button" class="btn" data-p="7">Цена выше ATC</button>
</div>
<div class="kpis">
  <div class="kpi"><div class="k-l">Выпуск Q</div><div class="k-v" id="k-q"></div></div>
  <div class="kpi"><div class="k-l">Выручка TR</div><div class="k-v" id="k-tr"></div></div>
  <div class="kpi"><div class="k-l">Издержки TC</div><div class="k-v" id="k-tc"></div></div>
  <div class="kpi"><div class="k-l">Прибыль</div><div class="k-v" id="k-pi"></div></div>
</div>
<div class="result" id="result" aria-live="polite"></div>

<script>
/* Учебная модель короткого периода: капитал постоянен, переменный фактор — труд.
   TP(L) = t·(3L² − 0,2L³): MP = t·(6L − 0,6L²) — максимум при L = 5; AP = t·(3L − 0,2L²) — максимум при L = 7,5.
   Издержки: VC = w·L, AVC = w / AP, MC = w / MP (как на лекции). Деньги — тыс. ₽, выпуск — штуки. */
const $ = (id) => document.getElementById(id);
const els = ["l", "p", "w", "fc", "t"].reduce((o, k) => (o[k] = $(k), o), {});
const v = (k) => Number(els[k].value);

const tp = (L) => v("t") * (3 * L * L - 0.2 * L ** 3);
const ap = (L) => v("t") * (3 * L - 0.2 * L * L);
const mp = (L) => v("t") * (6 * L - 0.6 * L * L);
const fmt = (x, d = 1) => x.toLocaleString("ru-RU", { maximumFractionDigits: d });

const Y_MAX = 8;
const L_MIN_AVC = 7.5;

function optimumL() {
  // На растущей ветви MC (L > 5) решаем P = w / MP; производим, только если P ≥ min AVC.
  const P = v("p");
  const minAvc = v("w") / ap(L_MIN_AVC);
  if (P < minAvc) return null;
  let lo = 5, hi = 9.99;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    if (v("w") / mp(mid) < P) lo = mid; else hi = mid;
  }
  return lo;
}

function path(points) {
  return points.map((pt, i) => `${i ? "L" : "M"}${pt[0].toFixed(1)},${pt[1].toFixed(1)}`).join(" ");
}

function render() {
  const L = v("l"), P = v("p"), w = v("w"), FC = v("fc");
  $("l-v").textContent = fmt(L);
  $("p-v").textContent = `${fmt(P)} тыс.`;
  $("w-v").textContent = `${w} тыс.`;
  $("fc-v").textContent = `${FC} тыс.`;
  $("t-v").textContent = `×${fmt(v("t"), 2)}`;

  // Левый график: AP и MP от L.
  const apMax = 18 * v("t") > 16 ? 18 * v("t") : 16;
  const px = (l) => 30 + (l / 10) * 220;
  const py = (y) => 175 - (Math.max(y, 0) / apMax) * 155;
  const ls = Array.from({ length: 96 }, (_, i) => 0.1 + i * 0.1);
  let s = `<line x1="30" y1="175" x2="252" y2="175" stroke="#94a3b8"/><line x1="30" y1="12" x2="30" y2="175" stroke="#94a3b8"/>`;
  s += `<text x="34" y="12" font-size="10" fill="#64748b">шт. на работника</text><text x="252" y="192" font-size="10" fill="#64748b" text-anchor="end">L</text>`;
  s += `<path d="${path(ls.map((l) => [px(l), py(ap(l))]))}" fill="none" stroke="#16a34a" stroke-width="2.5"/>`;
  s += `<path d="${path(ls.filter((l) => mp(l) > 0).map((l) => [px(l), py(mp(l))]))}" fill="none" stroke="#4338ca" stroke-width="2.5"/>`;
  s += `<circle cx="${px(L_MIN_AVC)}" cy="${py(ap(L_MIN_AVC))}" r="4" fill="#d97706"/>`;
  s += `<text x="${px(L_MIN_AVC) + 4}" y="${py(ap(L_MIN_AVC)) - 6}" font-size="9" fill="#92400e">max AP</text>`;
  s += `<line x1="${px(L)}" x2="${px(L)}" y1="12" y2="175" stroke="#0f172a" stroke-dasharray="3 3"/>`;
  s += `<g font-size="10"><text x="200" y="28" fill="#16a34a" font-weight="700">AP</text><text x="200" y="42" fill="#4338ca" font-weight="700">MP</text></g>`;
  $("prod").innerHTML = s;

  // Правый график: ATC, AVC, AFC, MC и цена от Q.
  const qMax = tp(10) * 1.02;
  const cx = (q) => 34 + (q / qMax) * 356;
  const cy = (y) => 175 - (Math.min(Math.max(y, 0), Y_MAX) / Y_MAX) * 160;
  let c = `<line x1="34" y1="175" x2="392" y2="175" stroke="#94a3b8"/><line x1="34" y1="12" x2="34" y2="175" stroke="#94a3b8"/>`;
  c += `<text x="38" y="12" font-size="10" fill="#64748b">тыс. ₽ за штуку</text><text x="392" y="192" font-size="10" fill="#64748b" text-anchor="end">Q, шт.</text>`;
  const curve = (f, color, dash = "") => {
    const pts = ls.map((l) => [tp(l), f(l)]).filter((p) => p[1] <= Y_MAX && p[1] > 0);
    return `<path d="${path(pts.map((p) => [cx(p[0]), cy(p[1])]))}" fill="none" stroke="${color}" stroke-width="2.5" ${dash ? `stroke-dasharray="${dash}"` : ""}/>`;
  };
  c += curve((l) => FC / tp(l), "#94a3b8", "4 3");
  c += curve((l) => w / ap(l), "#16a34a");
  c += curve((l) => w / ap(l) + FC / tp(l), "#0f172a");
  c += curve((l) => (mp(l) > 0 ? w / mp(l) : Infinity), "#4338ca");
  c += `<line x1="34" x2="392" y1="${cy(P)}" y2="${cy(P)}" stroke="#d97706" stroke-width="2"/>`;
  c += `<text x="388" y="${cy(P) - 4}" font-size="10" fill="#92400e" text-anchor="end" font-weight="700">P = MR</text>`;
  c += `<g font-size="10" font-weight="700"><text x="200" y="26" fill="#0f172a">ATC</text><text x="230" y="26" fill="#16a34a">AVC</text><text x="262" y="26" fill="#4338ca">MC</text><text x="290" y="26" fill="#94a3b8">AFC</text></g>`;
  const q = tp(L);
  c += `<line x1="${cx(q)}" x2="${cx(q)}" y1="12" y2="175" stroke="#0f172a" stroke-dasharray="3 3"/>`;
  $("cost").innerHTML = c;

  // Показатели и вывод.
  const TR = P * q, VC = w * L, TC = FC + VC, PI = TR - TC;
  $("k-q").textContent = fmt(q, 0);
  $("k-tr").textContent = fmt(TR, 0);
  $("k-tc").textContent = fmt(TC, 0);
  $("k-pi").textContent = fmt(PI, 0);
  $("k-pi").style.color = PI >= 0 ? "#16a34a" : "#dc2626";

  const minAvc = w / ap(L_MIN_AVC);
  const Lopt = optimumL();
  const piOpt = Lopt ? P * tp(Lopt) - FC - w * Lopt : -FC;
  const atcOpt = Lopt ? (FC + w * Lopt) / tp(Lopt) : Infinity;
  let msg = `Сейчас AVC = <b>${fmt(w / ap(L), 2)}</b>, MC = <b>${mp(L) > 0 ? fmt(w / mp(L), 2) : "∞"}</b>, ATC = <b>${fmt(w / ap(L) + FC / q, 2)}</b> тыс. ₽ за штуку. `;
  if (!Lopt) {
    msg += `Цена <b>${fmt(P)}</b> ниже минимума AVC (${fmt(minAvc, 2)}): выручка не покрывает даже зарплату. <b>Закрыться дешевле</b>: убыток составит только FC = ${FC}.`;
  } else if (P < atcOpt) {
    msg += `Цена выше min AVC (${fmt(minAvc, 2)}), но ниже ATC в оптимуме: <b>в коротком периоде работаем в убыток ${fmt(-piOpt, 0)}</b> — меньше, чем FC = ${FC} при закрытии. Лучший объём ≈ ${fmt(tp(Lopt), 0)} шт. (L ≈ ${fmt(Lopt)}), где P = MC.`;
  } else {
    msg += `Цена выше ATC: <b>прибыль</b>. Максимум ≈ ${fmt(piOpt, 0)} при объёме ≈ ${fmt(tp(Lopt), 0)} шт. (L ≈ ${fmt(Lopt)}), где P = MR = MC.`;
  }
  $("result").innerHTML = msg;
}

Object.values(els).forEach((el) => el.addEventListener("input", render));
$("opt").addEventListener("click", () => {
  const Lopt = optimumL();
  els.l.value = Lopt ? Lopt.toFixed(1) : "0.5";
  render();
});
document.querySelectorAll("[data-p]").forEach((b) => b.addEventListener("click", () => {
  els.w.value = "30"; els.fc.value = "150"; els.t.value = "1";
  els.p.value = b.dataset.p;
  const Lopt = optimumL();
  els.l.value = Lopt ? Lopt.toFixed(1) : "0.5";
  render();
}));
render();
</script>
</body>
</html>
